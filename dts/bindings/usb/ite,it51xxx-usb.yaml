description: IT51XXX USB

compatible: "ite,it51xxx-usb"

include: [pinctrl-device.yaml, usb-ep.yaml]

properties:
  reg:
    required: true

  interrupts-extended:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  wucctrl:
    type: phandles
    description: |
      usbd node WUC interrupt.
