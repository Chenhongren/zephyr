description: ITE IT51XXX usb host controller

compatible: "ite,it51xxx-uhc"

include: [usb-controller.yaml, pinctrl-device.yaml]

properties:
  phy-handle:
    type: phandle

  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  extend-ctrl:
    type: array
    description: |
      Extend control configuration for UHC pin mapping on some
      it51xxx SoCs. It is defined as: <reg_address enable_bit disable_bit>
